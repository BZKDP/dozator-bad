<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 3; rx: 10; }
      .small { font: 20px Arial, sans-serif; fill: #111827; }
      .label { font: 24px Arial, sans-serif; font-weight: 700; fill: #111827; }
      .note { font: 18px Arial, sans-serif; fill: #374151; }
      .pin { fill: #eef2ff; stroke: #334155; stroke-width: 2; }
      .plus { stroke: #dc2626; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .minus { stroke: #111827; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .signal { stroke: #f59e0b; stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .usb { stroke: #2563eb; stroke-width: 6; fill: none; stroke-linecap: round; stroke-dasharray: 10 8; }
      .bad { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 8; }
      .ok { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>

  <text x="40" y="48" class="label">ESP32 + LM2596 + WAGO + MG90S</text>
  <text x="40" y="82" class="note">LM2596 уже выставлен на 5 В. OUT+ и OUT- идут в две отдельные WAGO-клеммы.</text>

  <!-- LM2596 -->
  <rect x="55" y="155" width="245" height="180" class="box"/>
  <text x="95" y="192" class="label">LM2596</text>
  <text x="88" y="222" class="note">понижайка</text>
  <circle cx="280" cy="220" r="13" class="pin"/>
  <circle cx="280" cy="285" r="13" class="pin"/>
  <text x="90" y="225" class="small">OUT+</text>
  <text x="90" y="291" class="small">OUT-</text>
  <text x="226" y="226" class="small">+5V</text>
  <text x="224" y="291" class="small">GND</text>

  <!-- WAGO plus -->
  <rect x="430" y="165" width="210" height="90" class="box"/>
  <text x="465" y="200" class="label">WAGO +5V</text>
  <text x="455" y="230" class="note">красные провода</text>

  <!-- WAGO ground -->
  <rect x="430" y="300" width="210" height="105" class="box"/>
  <text x="462" y="338" class="label">WAGO GND</text>
  <text x="456" y="368" class="note">чёрные / земля</text>

  <!-- Servo -->
  <rect x="850" y="145" width="255" height="205" class="box"/>
  <text x="915" y="185" class="label">MG90S</text>
  <text x="895" y="218" class="note">серво снят с механики</text>
  <circle cx="865" cy="260" r="12" class="pin"/>
  <circle cx="865" cy="295" r="12" class="pin"/>
  <circle cx="865" cy="330" r="12" class="pin"/>
  <text x="890" y="267" class="small">красный +5V</text>
  <text x="890" y="302" class="small">коричневый / чёрный GND</text>
  <text x="890" y="337" class="small">оранжевый / жёлтый SIGNAL</text>

  <!-- ESP32 -->
  <rect x="430" y="500" width="310" height="185" class="box"/>
  <text x="535" y="540" class="label">ESP32</text>
  <text x="485" y="573" class="note">питание от USB компьютера</text>
  <circle cx="430" cy="620" r="13" class="pin"/>
  <circle cx="740" cy="620" r="13" class="pin"/>
  <text x="455" y="627" class="small">GND</text>
  <text x="635" y="627" class="small">GPIO13</text>

  <!-- Computer USB -->
  <rect x="865" y="515" width="235" height="120" class="box"/>
  <text x="918" y="557" class="label">Компьютер</text>
  <text x="902" y="591" class="note">USB к ESP32</text>

  <!-- wires -->
  <path class="plus" d="M280 220 C345 220 365 210 430 210"/>
  <path class="plus" d="M640 210 C720 210 765 260 865 260"/>

  <path class="minus" d="M280 285 C345 285 365 350 430 350"/>
  <path class="minus" d="M640 350 C725 350 775 295 865 295"/>
  <path class="minus" d="M535 405 L535 460 C535 495 475 495 430 620"/>

  <path class="signal" d="M740 620 C815 620 815 455 865 330"/>

  <path class="usb" d="M740 565 C800 565 815 575 865 575"/>

  <!-- captions -->
  <text x="334" y="205" class="small" fill="#dc2626">OUT+ красный</text>
  <text x="315" y="330" class="small">OUT- чёрный</text>
  <text x="690" y="203" class="small" fill="#dc2626">красный серво</text>
  <text x="678" y="326" class="small">земля серво</text>
  <text x="742" y="505" class="small" fill="#f59e0b">сигнал GPIO13</text>
  <text x="505" y="470" class="small">общая земля</text>

  <!-- warnings -->
  <rect x="55" y="520" width="330" height="95" class="bad"/>
  <text x="80" y="555" class="label" fill="#991b1b">НЕ подключать</text>
  <text x="80" y="585" class="small" fill="#991b1b">12 В к серво, 5V ESP32 или GPIO</text>

  <rect x="55" y="630" width="330" height="70" class="ok"/>
  <text x="80" y="662" class="label" fill="#166534">Нужно</text>
  <text x="80" y="690" class="small" fill="#166534">OUT- LM2596 = GND серво = GND ESP32</text>
</svg>
