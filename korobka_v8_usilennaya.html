<ol>
<li><b>Разметь дно</b> коробки: 75—4—75—4—75—4—75—4—75 (см. «Дно — разметка»).</li>
<li><b>Разметь 4 перегородки</b>: линии А (0→138) и Б (360→184 в точке 540).</li>
<li>Те же линии А и Б — на внутренних боковых стенках коробки (для каналов 1 и 5).</li>
<li><b>Вклей перегородки</b> стоймя по разметке дна.</li>
<li><b>Прорежь 5 окон</b> в переднем торце — по месту, напротив каналов, высота 56 от дна.</li>
<li><b>Уголки-опоры</b> (134) — в задние углы каналов.</li>
<li><b>Нижние листы</b> 845×75: сверху наклонно, нос в окно, снаружи 220. Клей по линиям А.</li>
<li><b>Борта:</b> используй 6 из 10 нарезанных деталей — два крайних и четыре общих. Сначала проверь все пять просветов банкой.</li>
<li><b>Верхние листы</b> 568×75 по линиям Б: перед 360, зад 184, до задней стенки НЕ доходить ~60.</li>
<li><b>Стяни фасад</b> двумя планками над окнами и шестью болтами М4 с широкими шайбами.</li>
<li><b>Поставь общий мост</b> под пять лотков — одна перекладина и две ножки.</li>
<li><b>Затворы</b> (5 шт) на общие борта · коробку на КРЕПКИЙ подиум 100 · приёмники под лотки.</li>
</ol>
<h3>Проверка каждого канала</h3>
<div class="t">Насыпь 20 банок: сползли по складу к обрыву → упали → очередь → затвор выдаёт по одной. Если куча залипла на складе — оклей склад глянцевым скотчем. Полная коробка ~200 банок (~12 кг).</div>`;

function showCard(key){
  const c=CARDS[key];
  let h=`<h2>${c.t}</h2><div class="badges"><span class="badge">${c.q}</span><span class="badge${c.m.includes('3 мм')||c.m.includes('КРЕПКИЙ')?' red':''}">${c.m}</span></div>${c.svg}`;
  h+=`<h3>✂ Как резать</h3><ol>${c.cut.map(s=>'<li>'+s+'</li>').join('')}</ol>`;
  h+=`<h3>🧴 Куда клеить</h3><ol>${c.glue.map(s=>'<li>'+s+'</li>').join('')}</ol>`;
  document.getElementById('cbody').innerHTML=h;
  document.getElementById('card').style.display='block';
}
function showAssembly(){
  document.getElementById('cbody').innerHTML=ASSEMBLY;
  document.getElementById('card').style.display='block';
}

// ================= 3D =================
function makeJar(color){
  const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(JR,JR,JL-6,20),
    new THREE.MeshStandardMaterial({color:color,roughness:.5}));
  b.rotation.x=Math.PI/2; g.add(b);
  const c=new THREE.Mesh(new THREE.CylinderGeometry(JR*.68,JR*.68,6,16),
    new THREE.MeshStandardMaterial({color:0xe8ecef,roughness:.6}));
  c.rotation.x=Math.PI/2; c.position.z=JL/2-3; g.add(c);
  return g;
}
function bxm(w,h,d,col,op){
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({color:col,roughness:.85,transparent:!!op,opacity:op||1}));
}
function part(mesh,key){ mesh.userData.key=key; clickable.push(mesh); return mesh; }
function frame(w,h,d,color){ return new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(w,h,d)),
  new THREE.LineBasicMaterial({color:color})); }

function buildChannel(zc,color){
  const FULL=IN.w+220;
  const bl=bxm(FULL,4,LANEW,CARD);
  bl.position.set(T+(IN.w-220)/2, lowY((IN.w-220)/2)-2, zc); bl.rotation.z=TB;
  world.add(part(bl,'bottom'));
  for(let lx=30;lx<=570;lx+=47){
    const j=makeJar(color); j.position.set(T+lx,lowY(lx)+2+JR,zc); world.add(j);
  }
  const jc=makeJar(color); jc.position.set(T+560,lowY(560)+2+JR+44,zc); world.add(jc);
  const ul=bxm(UP_LEN,4,LANEW,CARD);
  ul.position.set(T+UP_LEN/2, (upY(0)+upY(UP_LEN))/2-2, zc); ul.rotation.z=-TT;
  world.add(part(ul,'upper'));
  for(let lx=40;lx<=520;lx+=47){
    const j=makeJar(color); j.position.set(T+lx,upY(lx)+2+JR,zc); world.add(j);
  }
  for(let lx=160;lx<=510;lx+=47){
    const j=makeJar(color); j.position.set(T+lx,upY(lx)+2+JR+41,zc); world.add(j);
  }
  for(let lx=310;lx<=500;lx+=47){
    const j=makeJar(color); j.position.set(T+lx,upY(lx)+2+JR+82,zc); world.add(j);
  }
  const riser=bxm(4,134,LANEW,CARD); riser.position.set(T+IN.w-4,Y0+67,zc);
  world.add(part(riser,'riser'));
  const drop=bxm(52,170,LANEW-6,EXITC,0.10);
  drop.position.set(T+IN.w-30, Y0+210, zc); world.add(part(drop,'drop'));
  const jf=makeJar(color); jf.position.set(T+565,Y0+215,zc); world.add(jf);
  const ewv=bxm(5,56,76,EXITC,0.15); ewv.position.set(T,Y0+28,zc); world.add(part(ewv,'front'));
  const ew=frame(6,56,76,EXITC); ew.position.set(T,Y0+28,zc); world.add(ew);
  // Борта строятся один раз общими для соседних каналов в buildSharedOutputWalls().
  const gh=lowY(-190); const gus=bxm(3,gh,40,CARD); gus.position.set(T-190,gh/2,zc); world.add(gus);
  const gy=lowY(-135);
  for(const s of[-1,1]){ const sd=bxm(84,56,3,PRINT);
    sd.position.set(T-135, gy+47, zc+s*(78/2-2)); sd.rotation.z=TB; world.add(part(sd,'gate')); }
  const sv=bxm(13,32,24,0x3a66aa); sv.position.set(T-135, gy+72, zc); world.add(part(sv,'gate'));
  const g1=bxm(4,40,66,PRINT); g1.position.set(T-112, lowY(-112)+50, zc); g1.rotation.z=TB; world.add(part(g1,'gate'));
  const g2=bxm(5,44,66,PRINT); g2.position.set(T-170, lowY(-170)+22, zc); g2.rotation.z=TB; world.add(part(g2,'gate'));
  const jp=makeJar(color); jp.position.set(T-150, lowY(-150)+2+JR, zc); world.add(jp);
  const ct=frame(110,42,96,EXITC); ct.position.set(T-250,21,zc); world.add(ct);
  const cts=bxm(110,2,96,EXITC,0.15); cts.position.set(T-250,1,zc); world.add(part(cts,'tray'));
  const jt=makeJar(0x5fd08a); jt.position.set(T-250,JR+2,zc); world.add(jt);
}

function buildSharedOutputWalls(){
  for(let k=0;k<=NCH;k++){
    const w=bxm(220,47,3,CARD);
    w.position.set(T-110,lowY(-110)+23,T-1.5+PITCH*k);
    w.rotation.z=TB;
    world.add(part(w,'sharedWall'));
  }
}

function buildReinforcement(){
  // Две планки зажимают ослабленный окнами передний торец.
  const braceY=Y0+74;
  const outer=bxm(12,34,392,WOOD); outer.position.set(-6,braceY,200); world.add(part(outer,'frontBrace'));
  const inner=bxm(8,34,392,WOOD); inner.position.set(8,braceY,200); world.add(part(inner,'frontBrace'));
  for(const z of[16,80,159,238,317,384]){
    const bolt=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,28,12),new THREE.MeshStandardMaterial({color:METAL,roughness:.35}));
    bolt.rotation.z=Math.PI/2; bolt.position.set(0,braceY,z); world.add(bolt);
  }

  // Отдельный мост принимает вес всех лотков и затворов на стол.
  const sx=T-190, touchY=lowY(-190)-4;
  const rail=bxm(50,18,392,WOOD); rail.position.set(sx,touchY-9,200); world.add(part(rail,'supportRail'));
  const legH=Math.max(12,touchY-18);
  for(const z of[20,380]){
    const leg=bxm(30,legH,24,WOOD); leg.position.set(sx,legH/2,z); world.add(part(leg,'supportRail'));
  }
}

function build(){
  const pod=part(bxm(600,POD,400,0x2a3340),'pod');
  pod.position.set(300,POD/2,200); world.add(pod);
  const box=frame(600,400,400,0x3a5570); box.position.set(300,POD+200,200); world.add(box);
  const fp=bxm(IN.w,2,IN.d,0x2a3340,0.6); fp.position.set(300,Y0-1,200); world.add(part(fp,'floorplan'));
  for(let k=0;k<NCH;k++) buildChannel(T+37.5+PITCH*k, SKU[k]);
  buildSharedOutputWalls();
  for(let k=0;k<NCH-1;k++){
    const d=bxm(IN.w,IN.h,4,CARD,0.25);
    d.position.set(300,POD+200,T+LANEW+2+PITCH*k);
    world.add(part(d,'divider'));
  }
  buildReinforcement();
}

// ================= клик =================
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(x,y){
  ndc.x=(x/innerWidth)*2-1; ndc.y=-(y/innerHeight)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(clickable,false);
  if(hits.length) showCard(hits[0].object.userData.key);
}

// ================= сцена/управление =================
function init(){
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0f1216);
  scene.fog=new THREE.Fog(0x0f1216,1400,3200);
  camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,1,6000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(devicePixelRatio); renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,.55));
  const d1=new THREE.DirectionalLight(0xffffff,.85); d1.position.set(400,800,600); scene.add(d1);
  const d2=new THREE.DirectionalLight(0x88aaff,.3); d2.position.set(-500,300,-400); scene.add(d2);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(4200,4200),
    new THREE.MeshStandardMaterial({color:0x161b22,roughness:1}));
  fl.rotation.x=-Math.PI/2; fl.position.y=-2; scene.add(fl);
  world=new THREE.Group(); scene.add(world);
  setupControls();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
}
let tgt=new THREE.Vector3(180,240,200), radius=1250, theta=-0.85, phi=1.05;
const keys={};
function setupControls(){
  const el=renderer.domElement; let drag=false,px=0,py=0,mx=0,my=0,moved=0;
  el.addEventListener('pointerdown',e=>{drag=true;px=mx=e.clientX;py=my=e.clientY;moved=0;});
  addEventListener('pointerup',e=>{ drag=false; if(moved<6) pick(e.clientX,e.clientY); });
  addEventListener('pointermove',e=>{
    if(!drag)return;
    moved+=Math.abs(e.clientX-mx)+Math.abs(e.clientY-my); mx=e.clientX; my=e.clientY;
    theta-=(e.clientX-px)*0.006; phi-=(e.clientY-py)*0.006;
    phi=Math.max(0.15,Math.min(Math.PI-0.15,phi)); px=e.clientX; py=e.clientY;
  });
  el.addEventListener('wheel',e=>{e.preventDefault();
    radius*=(1+Math.sign(e.deltaY)*0.08); radius=Math.max(180,Math.min(3600,radius));},{passive:false});
  addEventListener('keydown',e=>{keys[e.code]=true; if(e.code.startsWith('Arrow'))e.preventDefault();});
  addEventListener('keyup',e=>{keys[e.code]=false;});
}
function flyStep(){
  const st=16;
  const fwd=new THREE.Vector3().subVectors(tgt,camera.position); fwd.y=0; fwd.normalize();
  const rt=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();
  if(keys.KeyW||keys.ArrowUp)tgt.addScaledVector(fwd,st);
  if(keys.KeyS||keys.ArrowDown)tgt.addScaledVector(fwd,-st);
  if(keys.KeyD||keys.ArrowRight)tgt.addScaledVector(rt,st);
  if(keys.KeyA||keys.ArrowLeft)tgt.addScaledVector(rt,-st);
  if(keys.KeyR||keys.PageUp)tgt.y+=st;
  if(keys.KeyF||keys.PageDown)tgt.y-=st;
}
function animate(){
  requestAnimationFrame(animate);
  flyStep();
  camera.position.set(
    tgt.x+radius*Math.sin(phi)*Math.cos(theta),
    tgt.y+radius*Math.cos(phi),
    tgt.z+radius*Math.sin(phi)*Math.sin(theta));
  camera.lookAt(tgt);
  renderer.render(scene,camera);
}

// запуск строго в конце
init();
build();
animate();
</script>
