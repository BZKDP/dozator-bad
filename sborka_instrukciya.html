<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дозатор БАД — сборка по шагам (коробка 600×400×400)</title>
<style>
  :root{--pap:#f7f4ec;--ink:#23272e;--mut:#5c6672;--blue:#1f6fd6;--green:#1f9d57;--red:#d63a2f;--amber:#c98a1a;--line:#d9d2c4}
  *{box-sizing:border-box}
  html,body{margin:0;background:#e7e2d6;color:var(--ink);font-family:'Segoe UI',system-ui,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  header h1{font-size:18px;margin:0}
  header .sub{color:var(--mut);font-size:13px}
  .btn{border:1px solid #c3bba9;background:#fff;color:var(--ink);border-radius:9px;padding:9px 14px;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  .card{background:var(--pap);border:1px solid var(--line);border-radius:16px;padding:22px 26px;box-shadow:0 6px 22px rgba(0,0,0,.08)}
  .stepno{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;background:var(--ink);color:#fff;border-radius:12px;font-size:22px;font-weight:800;padding:0 8px}
  .head{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .head h2{font-size:22px;margin:0}
  .tools{color:var(--mut);font-size:13px;margin:2px 0 14px}
  .tools b{color:var(--ink)}
  .figure{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;margin:6px 0 16px}
  .figure svg{max-width:100%;height:auto}
  .do{font-size:16.5px;line-height:1.7}
  .do ol{margin:6px 0;padding-left:26px}
  .do li{margin:8px 0}
  .do b{background:#fff3cf;padding:0 3px;border-radius:3px}
  .why{margin-top:14px;padding:12px 14px;background:#eef6ee;border-left:4px solid var(--green);border-radius:8px;font-size:14.5px;color:#2b4a35}
  .warn{margin-top:12px;padding:12px 14px;background:#fdecea;border-left:4px solid var(--red);border-radius:8px;font-size:14.5px;color:#7a241d;font-weight:600}
  .nav{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:10px}
  .dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .dot{width:11px;height:11px;border-radius:50%;background:#cabfa8;cursor:pointer}
  .dot.on{background:var(--ink)}
  table.cut{width:100%;border-collapse:collapse;font-size:14.5px;margin:4px 0}
  table.cut th,table.cut td{border:1px solid var(--line);padding:7px 9px;text-align:left}
  table.cut th{background:#efe9db}
  table.cut td.red{color:var(--red);font-weight:700}
  .legend{font-size:13px;color:var(--mut);margin-top:8px}
  .swatch{display:inline-block;width:22px;height:4px;vertical-align:middle;margin:0 4px}
  @media print{
    body{background:#fff}
    .nav,header .btn,.dots{display:none}
    .card{page-break-after:always;box-shadow:none;border:none}
    .allmode .card{display:block!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Сборка дозатора БАД</h1><div class="sub">Коробка 600×400×400 · 5 каналов · ~200 банок</div></div>
    <div>
      <button class="btn" onclick="toggleAll()">🖨 Печать всего</button>
    </div>
  </header>

  <div id="stage"></div>

  <div class="nav">
    <button class="btn" onclick="go(-1)">← Назад</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" onclick="go(1)">Дальше →</button>
  </div>
</div>

<script>

// размер: горизонтальный
function DH(x1,x2,y,txt){ const m=(x1+x2)/2; return `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#5c6672" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="${m-22}" y="${y-9}" width="44" height="16" fill="#fff"/><text x="${m}" y="${y+4}" text-anchor="middle" font-size="13" fill="#5c6672" font-weight="700">${txt}</text>`; }
// размер: вертикальный
function DV(y1,y2,x,txt){ const m=(y1+y2)/2; return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="#5c6672" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><rect x="${x-20}" y="${m-8}" width="40" height="16" fill="#fff"/><text x="${x}" y="${m+4}" text-anchor="middle" font-size="13" fill="#5c6672" font-weight="700">${txt}</text>`; }

// ===== рендер =====
let cur=0, allMode=false;
function render(){
  const stage=document.getElementById('stage');
  if(allMode){
    stage.innerHTML=STEPS.map((s,i)=>cardHTML(s,i)).join('');
    document.body.classList.add('allmode');
    return;
  }
  document.body.classList.remove('allmode');
  stage.innerHTML=cardHTML(STEPS[cur],cur);
  const dots=document.getElementById('dots');
  dots.innerHTML=STEPS.map((_,i)=>`<div class="dot ${i===cur?'on':''}" onclick="jump(${i})"></div>`).join('');
}
function cardHTML(s,i){
  return `<div class="card">
    <div class="head"><span class="stepno">${i+1}</span><h2>${s.t}</h2></div>
    <div class="tools">🧰 нужно: <b>${s.tools}</b> · шаг ${i+1} из ${STEPS.length}</div>
    <div class="figure">${s.fig}</div>
    <div class="do"><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div>
    ${s.why?`<div class="why">💡 <b>Зачем:</b> ${s.why}</div>`:''}
  </div>`;
}
function go(d){ cur=Math.max(0,Math.min(STEPS.length-1,cur+d)); if(allMode){allMode=false;} render(); window.scrollTo(0,0); }
function jump(i){ cur=i; render(); window.scrollTo(0,0); }
function toggleAll(){ allMode=!allMode; render(); if(allMode) setTimeout(()=>window.print(),300); }
addEventListener('keydown',e=>{ if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); });
render();
</script>
